version: 2

models:
  - name: mart_changelog
    columns:
      - name: release_id
        tests: [unique, not_null]
      - name: tool_slug
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tools')
                field: tool_slug
      - name: tool_name
        tests: [not_null]
      - name: version
        tests: [not_null]
      - name: has_breaking
        tests: [not_null]

  - name: mart_articles
    columns:
      - name: article_id
        tests: [unique, not_null]
      - name: url
        tests: [not_null]
      - name: tool_names
        tests: [not_null]

  - name: mart_ecosystem
    columns:
      - name: tool_slug
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tools')
                field: tool_slug
      - name: tool_name
        tests: [not_null]
      - name: release_count
        tests: [not_null]
      - name: article_count
        tests: [not_null]

  - name: mart_digest
    columns:
      - name: tool_slug
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tools')
                field: tool_slug
      - name: release_count_7d
        tests: [not_null]
      - name: article_count_7d
        tests: [not_null]

  - name: mart_roadmap
    columns:
      - name: slug
        tests: [unique, not_null]
      - name: tipo
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['concepto', 'herramienta', 'capacidad-cloud']
      - name: nombre
        tests: [not_null]
      - name: resuelve
        tests: [not_null]
      - name: dominado_cuando
        tests: [not_null]
      - name: nivel
        tests: [not_null]

  - name: mart_roadmap_wizard
    description: Una fila por opción del wizard de Rumbo, con los nodos que declara.
    columns:
      - name: kind
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['objetivo', 'partida']
      - name: slug
        tests: [not_null]
      - name: nombre
        tests: [not_null]
      - name: descripcion
        tests: [not_null]
      - name: orden
        tests: [not_null]

  - name: mart_roadmap_blurb
    description: El párrafo "por qué este orden" de cada ruta personalizada de Rumbo, si tiene uno vigente.
    columns:
      - name: objetivo
        tests: [not_null]
      - name: partida
        tests: [not_null]
      - name: texto
        tests: [not_null]
      - name: generated_at
        tests: [not_null]
