version: 2

models:
  - name: mart_changelog
    columns:
      - name: release_id
        tests: [unique, not_null]
      - name: tool_slug
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tools')
                field: tool_slug
      - name: tool_name
        tests: [not_null]
      - name: version
        tests: [not_null]
      - name: has_breaking
        tests: [not_null]

  - name: mart_articles
    columns:
      - name: article_id
        tests: [unique, not_null]
      - name: url
        tests: [not_null]
      - name: tool_names
        tests: [not_null]

  - name: mart_ecosystem
    columns:
      - name: tool_slug
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tools')
                field: tool_slug
      - name: tool_name
        tests: [not_null]
      - name: release_count
        tests: [not_null]
      - name: article_count
        tests: [not_null]

  - name: mart_digest
    columns:
      - name: tool_slug
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tools')
                field: tool_slug
      - name: release_count_7d
        tests: [not_null]
      - name: article_count_7d
        tests: [not_null]
