version: 2

sources:
  - name: de_radar
    schema: public
    tables:
      - name: dim_tool
      - name: fct_release
      - name: release_changes
      - name: articles
      - name: fct_article_mention
      - name: summaries
      - name: roadmap_node
      - name: roadmap_edge
      - name: roadmap_experience
      - name: roadmap_source
      - name: roadmap_implementation

models:
  - name: stg_tools
    columns:
      - name: tool_slug
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: stg_releases
    columns:
      - name: release_id
        tests: [unique, not_null]
      - name: version
        tests: [not_null]
      - name: published_at
        tests: [not_null]

  - name: stg_articles
    columns:
      - name: article_id
        tests: [unique, not_null]
      - name: relevance_score
        tests: [not_null]

  - name: stg_article_mentions
    columns:
      - name: article_id
        tests: [not_null]
      - name: tool_slug
        tests: [not_null]

  - name: stg_summaries
    columns:
      - name: article_id
        tests: [not_null]
      - name: idioma
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["en", "es"]
      - name: text
        tests: [not_null]

  - name: stg_roadmap_nodes
    columns:
      - name: slug
        tests: [unique, not_null]
      - name: tipo
        tests: [not_null]
      - name: nivel
        tests: [not_null]

  - name: stg_roadmap_edges
    columns:
      - name: from_slug
        tests: [not_null]
      - name: to_slug
        tests: [not_null]
