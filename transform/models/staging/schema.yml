version: 2

sources:
  - name: de_radar
    schema: public
    tables:
      - name: dim_tool
      - name: fct_release
      - name: release_changes

models:
  - name: stg_tools
    columns:
      - name: tool_slug
        tests: [not_null]
      - name: is_current
        tests: [not_null]

  - name: stg_releases
    columns:
      - name: release_id
        tests: [unique, not_null]
      - name: version
        tests: [not_null]
      - name: published_at
        tests: [not_null]
