name: ingest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Ingestar releases
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        run: uv run python -m pipeline.run

      - name: Ingestar artículos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_SUMMARY: ${{ vars.GEMINI_MODEL_SUMMARY }}
          GEMINI_MODEL_JUDGE: ${{ vars.GEMINI_MODEL_JUDGE }}
        run: uv run python -m pipeline.run_articles

      - name: Sincronizar la ruta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL_SUMMARY: ${{ vars.GEMINI_MODEL_SUMMARY }}
          GEMINI_MODEL_JUDGE: ${{ vars.GEMINI_MODEL_JUDGE }}
        run: uv run python -m pipeline.run_roadmap

      - name: Transformar con dbt
        working-directory: transform
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGPORT: ${{ secrets.PGPORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
        run: |
          uv run dbt run
          uv run dbt test

      - name: Revalidar el sitio
        run: |
          curl -sf -X POST "${{ secrets.VERCEL_APP_URL }}/api/revalidate" \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}"

      - name: Enviar alertas
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: uv run python -m pipeline.alerts

      - name: Abrir issue si la corrida falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ingesta falló — ${new Date().toISOString().slice(0, 10)}`,
              body: `La corrida diaria falló.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['pipeline-failure']
            })
